name: CI

# 只在 Actions 页面手动触发：推送到 main 或提交 PR 时不再自动运行。
# 需要检查某次改动时，在 Actions → CI → Run workflow 选择分支执行。
on:
  workflow_dispatch:

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Install app dependencies
        run: flutter pub get

      - name: Install core dependencies
        working-directory: packages/flashbyte_core
        run: dart pub get

      - name: Analyze app
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Test core package
        working-directory: packages/flashbyte_core
        run: dart test
