name: Build and Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Move source to F-Droid build path
        run: |
          sudo mkdir -p /home/vagrant/build
          sudo chown -R "$(whoami)" /home/vagrant
          cp -a "${GITHUB_WORKSPACE}/." /home/vagrant/build/com.flashbyte/

      - name: Install dependencies
        working-directory: /home/vagrant/build/com.flashbyte
        env:
          PUB_CACHE: /home/vagrant/build/com.flashbyte/.pub-cache
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: Decode Android signing keystore
        working-directory: /home/vagrant/build/com.flashbyte
        run: echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > android/app/flashbyte-release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK
        working-directory: /home/vagrant/build/com.flashbyte
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUB_CACHE: /home/vagrant/build/com.flashbyte/.pub-cache
        run: flutter build apk --release

      - name: Build split APKs
        working-directory: /home/vagrant/build/com.flashbyte
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUB_CACHE: /home/vagrant/build/com.flashbyte/.pub-cache
        run: flutter build apk --release --split-per-abi

      - name: Build app bundle
        working-directory: /home/vagrant/build/com.flashbyte
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUB_CACHE: /home/vagrant/build/com.flashbyte/.pub-cache
        run: flutter build appbundle --release

      - name: Collect Android artifacts
        working-directory: /home/vagrant/build/com.flashbyte
        run: |
          mkdir -p release/android
          cp build/app/outputs/flutter-apk/app-release.apk release/android/flashbyte-android.apk
          cp build/app/outputs/bundle/release/app-release.aab release/android/flashbyte-android.aab
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/android/flashbyte-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/android/flashbyte-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/android/flashbyte-android-x86_64.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: /home/vagrant/build/com.flashbyte/release/android/*

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package Linux
        run: |
          mkdir -p release/linux
          tar -czf release/linux/flashbyte-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/linux/*

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # 解码 WINDOWS_CERTIFICATE_BASE64 并落盘为临时 PFX，导入当前用户的个人证书存储，
      # 导入后立即删除临时 PFX 以减少私钥在 runner 磁盘上的残留；
      # 将导入证书的指纹写入 GITHUB_ENV，供后续签名步骤按指纹精确取用。
      - name: Import Windows code signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 secret is not set"
          }
          if ([string]::IsNullOrEmpty($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD secret is not set"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "flashbyte-release.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))

          $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          try {
            $cert = Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $securePassword `
              -ErrorAction Stop
          } finally {
            Remove-Item -Force $pfxPath -ErrorAction SilentlyContinue
          }

          if (-not $cert.HasPrivateKey) {
            throw "Imported certificate has no private key; a PFX with private key is required"
          }
          Write-Host "Imported certificate thumbprint: $($cert.Thumbprint)"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)"

      # 按 WINDOWS_CERT_THUMBPRINT 从个人证书存储精确取出证书，
      # 对 flashbyte.exe 做 Authenticode 签名；时间戳服务器不可用时降级为无时间戳签名，
      # 最后校验签名状态为 Valid，避免未签名产物被继续打包。
      - name: Sign Flashbyte executable
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_THUMBPRINT)) {
            throw "WINDOWS_CERT_THUMBPRINT is not set; certificate import step may have failed"
          }
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $env:WINDOWS_CERT_THUMBPRINT } |
            Select-Object -First 1
          if ($null -eq $cert) { throw "Flashbyte signing certificate not found" }
          if (-not $cert.HasPrivateKey) { throw "Flashbyte signing certificate has no private key" }

          $exe = "build/windows/x64/runner/Release/flashbyte.exe"
          try {
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" -ErrorAction Stop | Out-Null
          } catch {
            Write-Warning "Timestamp server unavailable; signing without timestamp: $($_.Exception.Message)"
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -HashAlgorithm SHA256 -ErrorAction Stop | Out-Null
          }
          $sig = Get-AuthenticodeSignature -FilePath $exe
          Write-Host "flashbyte.exe signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "flashbyte.exe signature is not valid: $($sig.Status)" }

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/windows
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath release/windows/flashbyte-windows-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:').Line -replace '^version:\s*', ''
          $version = $version.Split('+')[0]
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction Stop | Select-Object -First 1
          & $iscc.FullName "/DMyAppVersion=$version" windows/installer/flashbyte.iss
          Copy-Item build/installer/flashbyte-windows-setup-x64.exe release/windows/flashbyte-windows-setup-x64.exe

      # 与 flashbyte.exe 使用同一张固定证书，对安装包做 Authenticode 签名；
      # 同样在时间戳不可用时降级，并校验签名状态为 Valid。
      - name: Sign Windows installer
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_THUMBPRINT)) {
            throw "WINDOWS_CERT_THUMBPRINT is not set; certificate import step may have failed"
          }
          $cert = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq $env:WINDOWS_CERT_THUMBPRINT } |
            Select-Object -First 1
          if ($null -eq $cert) { throw "Flashbyte signing certificate not found" }

          $installer = "release/windows/flashbyte-windows-setup-x64.exe"
          try {
            Set-AuthenticodeSignature -FilePath $installer -Certificate $cert -HashAlgorithm SHA256 -TimestampServer "http://timestamp.digicert.com" -ErrorAction Stop | Out-Null
          } catch {
            Write-Warning "Timestamp server unavailable; signing without timestamp: $($_.Exception.Message)"
            Set-AuthenticodeSignature -FilePath $installer -Certificate $cert -HashAlgorithm SHA256 -ErrorAction Stop | Out-Null
          }
          $sig = Get-AuthenticodeSignature -FilePath $installer
          Write-Host "installer signature status: $($sig.Status)"
          if ($sig.Status -ne "Valid") { throw "installer signature is not valid: $($sig.Status)" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/windows/*

  build-apple:
    name: iOS and macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Build macOS
        run: flutter build macos --release

      - name: Create macOS DMG
        uses: L-Super/create-dmg-actions@v1.0.3
        with:
          dmg_name: flashbyte-macos
          src_dir: build/macos/Build/Products/Release/flashbyte.app

      - name: Package Apple artifacts
        run: |
          mkdir -p release/apple
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app release/apple/flashbyte-ios-unsigned-runner-app.zip
          dmg_path="$(find . -maxdepth 3 -name 'flashbyte-macos*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "flashbyte-macos DMG was not created"
            find . -maxdepth 3 -name '*.dmg' -print
            exit 1
          fi
          cp "$dmg_path" release/apple/flashbyte-macos.dmg

      - name: Upload Apple artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple
          path: release/apple/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-android
      - build-linux
      - build-windows
      - build-apple
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Read app version
        id: app-version
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          versionName="${version%%+*}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${versionName}" >> "$GITHUB_OUTPUT"

      - name: Remove existing release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.app-version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi

          for asset in \
            flashbyte-android.apk \
            flashbyte-android.aab \
            flashbyte-android-11.apk \
            flashbyte-android-12.apk \
            flashbyte-android-13.apk \
            flashbyte-android-armeabi-v7a.apk \
            flashbyte-android-arm64-v8a.apk \
            flashbyte-android-x86_64.apk \
            flashbyte-linux-x64.tar.gz \
            flashbyte-windows-x64.zip \
            flashbyte-windows-setup-x64.exe \
            flashbyte-macos.dmg \
            flashbyte-ios-unsigned-runner-app.zip
          do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes 2>/dev/null || true
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app-version.outputs.tag }}
          name: ${{ steps.app-version.outputs.tag }}
          body: |
            ${{ steps.app-version.outputs.tag }}

            Commit: `${{ github.sha }}`.

            Artifacts:
            - Android APK and AAB
            - Linux x64 bundle
            - Windows x64 installer (self-signed) and portable ZIP
            - macOS DMG
            - unsigned iOS Runner.app bundle
          files: release-assets/**/*
          fail_on_unmatched_files: true
          make_latest: true

      - name: Commit README release links
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_TAG: ${{ steps.app-version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"

            python3 - <<'PY'
          from pathlib import Path
          import os
          import textwrap

          readme = Path("README.md")
          text = readme.read_text()
          start = "<!-- BEGIN AUTO RELEASE DOWNLOADS -->"
          end = "<!-- END AUTO RELEASE DOWNLOADS -->"
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          section = textwrap.dedent(f"""\
          {start}
          | Platform | Download |
          |----------|----------|
          | Android | [APK]({base}/flashbyte-android.apk) \\| [AAB]({base}/flashbyte-android.aab) |
          | Linux | [TAR]({base}/flashbyte-linux-x64.tar.gz) |
          | macOS | [DMG]({base}/flashbyte-macos.dmg) |
          | iOS | [APP]({base}/flashbyte-ios-unsigned-runner-app.zip) |
          | Windows | [EXE]({base}/flashbyte-windows-setup-x64.exe) \\| [ZIP]({base}/flashbyte-windows-x64.zip) |
          {end}""")
          before, marker, rest = text.partition(start)
          if not marker:
              raise SystemExit("README release download start marker not found")
          _, marker, after = rest.partition(end)
          if not marker:
              raise SystemExit("README release download end marker not found")
          readme.write_text(before + section + after)
          PY

            if git diff --quiet README.md; then
              exit 0
            fi

            git add README.md
            git commit -m "docs: update release downloads [skip ci]"

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            git reset --hard HEAD~1
          done

          echo "Could not push README release links after 3 attempts."
          exit 1
